[project]
name = "notification-api"
version = "1.0.0"
description = "Notification API - Email, SMS, and push notification service"
authors = [
    {name = "monkeyboiii"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    # FastAPI and server
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic[email]==2.10.6",
    "pydantic-settings==2.7.0",

    # Notification providers (optional - enable when needed)
    # "sendgrid==6.11.0",  # Email via SendGrid
    # "twilio==9.0.0",  # SMS via Twilio
    # "firebase-admin==6.5.0",  # Push via Firebase Cloud Messaging

    # Utilities
    "loguru==0.7.3",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",  # For testing FastAPI
    "ruff==0.9.10",
    "mypy==1.15.0",
]

providers = [
    # Install real providers for production
    "sendgrid==6.11.0",
    "twilio==9.0.0",
    "firebase-admin==6.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Ruff configuration
[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "I",   # isort
    "W291", "W292", "W293",  # trailing whitespace
    "UP",  # pyupgrade
]

[tool.ruff.lint.isort]
force-single-line = false
lines-after-imports = 2

# MyPy configuration
[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
]
asyncio_mode = "auto"
