[project]
name = "auth-api"
version = "1.0.0"
description = "Auth API - Authentication and authorization service with JWT and OAuth2"
authors = [
    {name = "monkeyboiii"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    # FastAPI and server
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic[email]==2.10.6",
    "pydantic-settings==2.7.0",

    # Database
    "sqlalchemy==2.0.36",
    "psycopg2-binary==2.9.10",

    # Authentication
    "python-jose[cryptography]==3.3.0",
    "cryptography>=43.0.1",  # Security: Fix CVE-2024-26130, CVE-2023-50782, CVE-2024-0727
    "passlib[bcrypt]==1.7.4",
    "bcrypt>=3.2.0,<4.0.0",  # Pin bcrypt <4.0 for passlib 1.7.4 compatibility
    "python-multipart==0.0.20",

    # Utilities
    "loguru==0.7.3",
    "python-dotenv==1.0.1",
    "requests>=2.31.0",  # HTTP requests for HaveIBeenPwned API
    "slowapi==0.1.9",  # Rate limiting for endpoints
    "tenacity==9.0.0",  # Retry logic with exponential backoff
    "prometheus-fastapi-instrumentator==7.0.0",  # Prometheus metrics
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",  # For testing FastAPI
    "ruff==0.9.10",
    "mypy==1.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Ruff configuration
[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "I",   # isort
    "W291", "W292", "W293",  # trailing whitespace
    "UP",  # pyupgrade
]

[tool.ruff.lint.isort]
force-single-line = false
lines-after-imports = 2

# MyPy configuration
[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
]
asyncio_mode = "auto"
