# Kubernetes Deployment for Stock Picker
# Production-ready deployment with autoscaling and health checks

apiVersion: v1
kind: Namespace
metadata:
  name: stock-picker

---
# ConfigMap for application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: stock-picker-config
  namespace: stock-picker
data:
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DATABASE: "stock_picker"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "production"

---
# Secret for sensitive data (create manually or use sealed-secrets)
apiVersion: v1
kind: Secret
metadata:
  name: stock-picker-secrets
  namespace: stock-picker
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME"
  REDIS_PASSWORD: "CHANGE_ME"
  SECRET_KEY: "CHANGE_ME"

---
# PostgreSQL StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: stock-picker
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: stock-picker-config
              key: POSTGRES_DATABASE
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: stock-picker-secrets
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          initialDelaySeconds: 5
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 50Gi

---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: stock-picker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        command:
        - redis-server
        - --appendonly
        - "yes"
        - --requirepass
        - $(REDIS_PASSWORD)
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: stock-picker-secrets
              key: REDIS_PASSWORD
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        volumeMounts:
        - name: redis-storage
          mountPath: /data
      volumes:
      - name: redis-storage
        persistentVolumeClaim:
          claimName: redis-pvc

---
# Stock Picker API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-picker-api
  namespace: stock-picker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: stock-picker-api
  template:
    metadata:
      labels:
        app: stock-picker-api
        version: v1
    spec:
      containers:
      - name: api
        image: ghcr.io/monkeyboiii/stock-picker:latest
        command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: stock-picker-config
        - secretRef:
            name: stock-picker-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5

---
# Stock Picker MCP Server Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-picker-mcp
  namespace: stock-picker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stock-picker-mcp
  template:
    metadata:
      labels:
        app: stock-picker-mcp
    spec:
      containers:
      - name: mcp
        image: ghcr.io/monkeyboiii/stock-picker:latest
        command: ["uvicorn", "app.mcp.server:app", "--host", "0.0.0.0", "--port", "8001"]
        ports:
        - containerPort: 8001
          name: http
        envFrom:
        - configMapRef:
            name: stock-picker-config
        - secretRef:
            name: stock-picker-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

---
# Horizontal Pod Autoscaler for API
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stock-picker-api-hpa
  namespace: stock-picker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stock-picker-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
