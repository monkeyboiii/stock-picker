# Kubernetes Services for Stock Picker

apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: stock-picker
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  clusterIP: None  # Headless service for StatefulSet

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: stock-picker
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: stock-picker-api-service
  namespace: stock-picker
  labels:
    app: stock-picker-api
spec:
  selector:
    app: stock-picker-api
  ports:
  - port: 80
    targetPort: 8000
    name: http
  type: LoadBalancer

---
apiVersion: v1
kind: Service
metadata:
  name: stock-picker-mcp-service
  namespace: stock-picker
spec:
  selector:
    app: stock-picker-mcp
  ports:
  - port: 8001
    targetPort: 8001
    name: http
  type: ClusterIP

---
# Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stock-picker-ingress
  namespace: stock-picker
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - api.stock-picker.example.com
    - mcp.stock-picker.example.com
    secretName: stock-picker-tls
  rules:
  - host: api.stock-picker.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: stock-picker-api-service
            port:
              number: 80
  - host: mcp.stock-picker.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: stock-picker-mcp-service
            port:
              number: 8001

---
# PersistentVolumeClaim for Redis
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: stock-picker
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
