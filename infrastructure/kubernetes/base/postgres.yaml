apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: stock-picker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: stock-picker
data:
  POSTGRES_DB: stock_picker
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: stock-picker
type: Opaque
# SECURITY: DO NOT commit actual secrets to git!
# Create this secret manually or use a secrets manager (Vault, Sealed Secrets, External Secrets Operator)
#
# Example creation command:
#   kubectl create secret generic postgres-secret \
#     --namespace=stock-picker \
#     --from-literal=POSTGRES_USER=stockpicker \
#     --from-literal=POSTGRES_PASSWORD=$(openssl rand -base64 32)
#
# For now, placeholder values (MUST be replaced before deployment):
stringData:
  POSTGRES_USER: REPLACE_ME
  POSTGRES_PASSWORD: REPLACE_ME
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: stock-picker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: stock-picker
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
