[project]
name = "stock-picker"
version = "0.1.0"
description = "Automated stock screening and analysis system for Chinese markets"
authors = [
    {name = "monkeyboiii"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["stock", "finance", "trading", "chinese-markets", "akshare"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "sqlalchemy==2.0.36",
    "akshare==1.16.44",
    "pydantic==2.10.6",
    "python-dotenv==1.0.1",
    "psycopg2==2.9.10",
    "loguru==0.7.3",
    "mypy==1.15.0",
    "google-api-python-client==2.160.0",
    "google-auth-httplib2==0.2.0",
    "google-auth-oauthlib==1.2.1",
    "gspread==6.1.4",
    "gspread-formatting==1.2.0",
    "pandas>=2.0.0",  # Required by akshare but not explicitly listed
]

[project.optional-dependencies]
dev = [
    "matplotlib==3.10.0",
    "ruff==0.9.10",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
stock-picker = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Ruff configuration
[tool.ruff]
target-version = "py310"
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# MyPy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Set to true when ready for strict typing
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "akshare.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "gspread.*"
ignore_missing_imports = true

# Pytest configuration (for future use)
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--disable-warnings",
]
