[project]
name = "stock-picker"
version = "0.1.0"
description = "Automated stock screening and analysis system for Chinese markets"
authors = [
    {name = "monkeyboiii"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
keywords = ["stock", "finance", "trading", "chinese-markets", "akshare"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "sqlalchemy==2.0.36",
    "akshare==1.17.85",
    "pydantic==2.10.6",
    "python-dotenv==1.0.1",
    "psycopg2-binary==2.9.10",
    "loguru==0.7.3",
    "mypy==1.15.0",
    "google-api-python-client==2.160.0",
    "google-auth-httplib2==0.2.0",
    "google-auth-oauthlib==1.2.1",
    "gspread==6.1.4",
    "gspread-formatting==1.2.0",
    "pandas>=2.0.0",  # Required by akshare but not explicitly listed
    "numpy>=1.24.0",  # Required for backtest metrics
    "scipy>=1.11.0",  # Required for statistical tests in comparison engine
    "pyyaml>=6.0.0",  # Required for strategy DSL
    "fastapi>=0.115.0",  # REST API framework
    "uvicorn[standard]>=0.32.0",  # ASGI server
    "python-multipart>=0.0.9",  # For file uploads
    "mcp>=1.0.0",  # Model Context Protocol SDK
    "sse-starlette>=2.0.0",  # Server-Sent Events for MCP streaming
    "httpx>=0.27.0",  # HTTP client for MCP
]

[project.optional-dependencies]
dev = [
    "matplotlib==3.10.0",
    "ruff==0.9.10",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
stock-picker = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Ruff configuration
[tool.ruff]
target-version = "py313"
# No line-length enforcement - let developers choose

[tool.ruff.lint]
select = [
    "F",   # pyflakes (syntax errors, undefined names)
    "I",   # isort (import organization)
    "W291", "W292", "W293",  # trailing whitespace
    "UP",  # pyupgrade (modern Python syntax)
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports

[tool.ruff.lint.isort]
force-single-line = false
lines-after-imports = 2

# Ruff format disabled - we don't want automatic reformatting of indentation
# Use --fix flag only for specific fixes (imports, whitespace)
[tool.ruff.format]
# Format is opt-in only - not run by default
exclude = ["*"]

# MyPy configuration
[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Set to true when ready for strict typing
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "akshare.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "gspread.*"
ignore_missing_imports = true

# Pytest configuration (for future use)
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--disable-warnings",
]
